<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<!--
  Imagen para compartir del landing (og:image y twitter:image, public/og-image.jpg): 1200×630.
  Mismo estilo que la portada de Facebook; las capturas son los demos del catálogo (/i/<plantilla>)
  abiertos en un teléfono de 390×844 (las demás están en ../facebook).
  Generar: google-chrome --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=4000 \
           --screenshot=og-image.png og-image.html   (y convertirla a JPEG en public/og-image.jpg)
-->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--plum:#2a1a2b;--gold:#dfa33f;--gold-l:#ecc077;--gold-deep:#b97a1f;--gold-pale:#f7e9cc;--ivory:#fffdf9;--rose:#b84c74;--rose-l:#dd93ac;--terra:#d97a4e;--teal:#4b93a4;--teal-l:#8fc2cd;--muted:#6b6470}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;font-family:Geist,sans-serif;color:var(--plum);background:radial-gradient(ellipse at 30% 20%,var(--gold-pale),var(--ivory) 62%)}
.blob{position:absolute;border-radius:50%;filter:blur(110px)}
.grid{position:absolute;inset:0;opacity:.05;background-image:linear-gradient(to right,var(--plum) 1px,transparent 1px),linear-gradient(to bottom,var(--plum) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at 35% 50%,black,transparent 72%)}

.text{position:absolute;left:72px;top:0;height:630px;width:560px;display:flex;flex-direction:column;justify-content:center}
.logo{display:inline-flex;align-items:center;width:fit-content;background:var(--plum);border-radius:999px;padding:10px 22px;margin-bottom:26px;box-shadow:0 16px 34px -16px rgba(42,26,43,.75)}
.logo img{height:36px;display:block}
h1{max-width:520px;font-size:60px;line-height:1;font-weight:600;letter-spacing:-.03em}
.hl{font-family:'Great Vibes',cursive;font-weight:400;font-size:1.32em;line-height:.7;padding:0 8px;background:linear-gradient(90deg,var(--gold-deep),var(--rose),var(--terra));-webkit-background-clip:text;color:transparent}
.sub{margin-top:20px;font-size:21px;line-height:1.4;color:var(--muted);max-width:520px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;max-width:540px}
.chip{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.85);border:1px solid rgba(42,26,43,.1);border-radius:999px;padding:8px 15px;font-size:16px;font-weight:500;box-shadow:0 4px 12px -6px rgba(42,26,43,.2)}
.dot{width:10px;height:10px;border-radius:50%}

.stage{position:absolute;left:620px;top:0;width:600px;height:630px}
.glow{position:absolute;left:150px;top:200px;width:520px;height:520px;border-radius:50%;background:conic-gradient(from 120deg,var(--gold-l),var(--rose-l),var(--teal-l),var(--gold-l));opacity:.5;filter:blur(70px)}
.ring{position:absolute;border-radius:50%;border:1.5px dashed rgba(223,163,63,.5)}
.phone{position:absolute;width:180px;height:390px;border-radius:32px;background:#1b111c;padding:9px;box-shadow:0 36px 70px -18px rgba(42,26,43,.55),0 10px 22px rgba(42,26,43,.18)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:25px;display:block}
.phone:after{content:'';position:absolute;top:14px;left:50%;width:48px;height:12px;margin-left:-24px;border-radius:10px;background:#1b111c}
.card{position:absolute;z-index:10;background:#fff;border:1px solid #ece8e4;border-radius:20px;box-shadow:0 22px 44px -16px rgba(42,26,43,.4)}
.toast{display:flex;gap:13px;align-items:center;padding:14px 18px}
.ok{width:42px;height:42px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.t1{font-size:17px;font-weight:600}.t2{font-size:14px;color:var(--muted);margin-top:2px}
.cd{display:flex;gap:7px;padding:12px 14px;align-items:center}
.cd div{background:var(--plum);color:#fff;border-radius:10px;width:50px;padding:7px 0;text-align:center}
.cd b{display:block;font-size:21px;font-weight:600;line-height:1}
.cd span{font-size:9px;letter-spacing:.08em;opacity:.65}
.petal,.spark{position:absolute}

</style>
</head>
<body>
<div class="blob" style="left:-140px;top:-160px;width:460px;height:420px;background:rgba(223,163,63,.32)"></div>
<div class="blob" style="left:380px;bottom:-220px;width:380px;height:340px;background:rgba(75,147,164,.18)"></div>
<div class="blob" style="right:-120px;top:-120px;width:440px;height:400px;background:rgba(184,76,116,.2)"></div>
<div class="grid"></div>

<svg class="petal" style="left:560px;top:50px;width:18px;color:rgba(184,76,116,.45);transform:rotate(30deg)" viewBox="0 0 24 32"><path d="M12 0C20 8 21 20 12 32C3 20 4 8 12 0Z" fill="currentColor"/></svg>
<svg class="petal" style="left:30px;top:560px;width:16px;color:rgba(223,163,63,.6);transform:rotate(-40deg)" viewBox="0 0 24 32"><path d="M12 0C20 8 21 20 12 32C3 20 4 8 12 0Z" fill="currentColor"/></svg>
<svg class="petal" style="left:420px;top:28px;width:13px;color:rgba(75,147,164,.45);transform:rotate(70deg)" viewBox="0 0 24 32"><path d="M12 0C20 8 21 20 12 32C3 20 4 8 12 0Z" fill="currentColor"/></svg>
<svg class="petal" style="left:520px;top:590px;width:14px;color:rgba(217,122,78,.5);transform:rotate(15deg)" viewBox="0 0 24 32"><path d="M12 0C20 8 21 20 12 32C3 20 4 8 12 0Z" fill="currentColor"/></svg>

<div class="text">
  <div class="logo"><img src="../../resources/js/app/assets/images/logo-negativo.png" alt="Convite"></div>
  <h1>La invitación que su evento <span class="hl">merece</span></h1>
  <p class="sub">Invitaciones digitales con sus fotos y su música, listas para compartir por WhatsApp.</p>
  <div class="chips">
    <span class="chip"><span class="dot" style="background:var(--rose)"></span>Bodas</span>
    <span class="chip"><span class="dot" style="background:var(--gold)"></span>XV años</span>
    <span class="chip"><span class="dot" style="background:var(--teal)"></span>Bautizos</span>
    <span class="chip"><span class="dot" style="background:#5f9e6e"></span>Baby showers</span>
    <span class="chip"><span class="dot" style="background:#8b6fd6"></span>Revelaciones de género</span>
    <span class="chip"><span class="dot" style="background:var(--terra)"></span>Cumpleaños</span>
  </div>
</div>

<div class="stage">
  <div class="glow" style="left:90px;top:110px;width:420px;height:420px"></div>
  <div class="ring" style="left:60px;top:80px;width:470px;height:470px"></div>
  <div class="ring" style="left:135px;top:155px;width:320px;height:320px;border-color:rgba(42,26,43,.12);border-style:solid"></div>

  <div class="phone" style="left:0px;top:130px;transform:rotate(-14deg) scale(.8)"><img src="../facebook/scr-boda-floral.jpg" alt=""></div>
  <div class="phone" style="left:350px;top:130px;transform:rotate(14deg) scale(.8)"><img src="../facebook/scr-xv-celestial.jpg" alt=""></div>
  <div class="phone" style="left:92px;top:108px;transform:rotate(-7deg) scale(.9);z-index:2"><img src="scr-baby-shower-lluvia.jpg" alt=""></div>
  <div class="phone" style="left:268px;top:108px;transform:rotate(7deg) scale(.9);z-index:2"><img src="scr-baby-shower-patito.jpg" alt=""></div>
  <div class="phone" style="left:185px;top:100px;z-index:3"><img src="scr-baby-shower-tendedero.jpg" alt=""></div>

  <div class="card toast" style="left:6px;top:482px;padding:11px 15px;gap:11px">
    <span class="ok" style="width:34px;height:34px;font-size:17px">✓</span>
    <span><span class="t1" style="display:block;font-size:15px">Familia López confirmó</span><span class="t2" style="display:block;font-size:12px">4 personas · ¡Ahí estaremos! 🎉</span></span>
  </div>
  <div class="card cd" style="left:372px;top:60px;padding:9px 11px;gap:6px">
    <div style="width:42px"><b style="font-size:18px">60</b><span>DÍAS</span></div><div style="width:42px"><b style="font-size:18px">07</b><span>HRS</span></div><div style="width:42px"><b style="font-size:18px">24</b><span>MIN</span></div>
  </div>

  <svg class="spark" style="left:70px;top:70px;width:22px;color:var(--gold)" viewBox="0 0 24 24"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z" fill="currentColor"/></svg>
  <svg class="spark" style="left:540px;top:520px;width:18px;color:var(--rose)" viewBox="0 0 24 24"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z" fill="currentColor"/></svg>
  <svg class="spark" style="left:560px;top:250px;width:13px;color:var(--teal)" viewBox="0 0 24 24"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z" fill="currentColor"/></svg>
</div>
</body>
</html>
