<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<!--
  Pin de Pinterest para las invitaciones de boda: 1000×1500 (proporción 2:3, la que Pinterest recomienda).
  Las capturas son las portadas de las demos de boda (/i/<plantilla>) en un teléfono de 390×844, tomadas después de
  abrir la invitación.
  Generar: google-chrome --headless=new --hide-scrollbars --window-size=1000,1500 --force-device-scale-factor=2 \
           --virtual-time-budget=4000 --screenshot=pin-bodas-1000x1500@2x.png pin-bodas.html
-->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--plum:#2a1a2b;--gold:#dfa33f;--gold-l:#ecc077;--gold-deep:#b97a1f;--gold-pale:#f7e9cc;--ivory:#fffdf9;--rose:#b84c74;--rose-l:#dd93ac;--terra:#d97a4e;--teal:#4b93a4;--teal-l:#8fc2cd;--muted:#6b6470}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1000px;height:1500px;overflow:hidden}
body{position:relative;font-family:Geist,sans-serif;color:var(--plum);background:radial-gradient(ellipse at 50% 18%,var(--gold-pale),var(--ivory) 60%)}
.blob{position:absolute;border-radius:50%;filter:blur(110px)}
.grid{position:absolute;inset:0;opacity:.05;background-image:linear-gradient(to right,var(--plum) 1px,transparent 1px),linear-gradient(to bottom,var(--plum) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at 50% 45%,black,transparent 72%)}

.head{position:absolute;left:0;right:0;top:80px;text-align:center}
.logo{display:inline-flex;align-items:center;background:var(--plum);border-radius:999px;padding:12px 26px;box-shadow:0 16px 34px -16px rgba(42,26,43,.75)}
.logo img{height:38px;display:block}
.eyebrow{margin-top:46px;font-size:22px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-deep)}
h1{margin-top:18px;font-size:78px;line-height:1.02;font-weight:600;letter-spacing:-.03em}
.hl{display:block;font-family:'Great Vibes',cursive;font-weight:400;font-size:1.6em;line-height:.95;background:linear-gradient(90deg,var(--gold-deep),var(--rose),var(--terra));-webkit-background-clip:text;color:transparent;padding:0 20px}

.stage{position:absolute;left:0;right:0;top:470px;height:720px}
.glow{position:absolute;left:230px;top:110px;width:540px;height:540px;border-radius:50%;background:conic-gradient(from 120deg,var(--gold-l),var(--rose-l),var(--teal-l),var(--gold-l));opacity:.5;filter:blur(70px)}
.ring{position:absolute;left:180px;top:60px;width:640px;height:640px;border-radius:50%;border:1.5px dashed rgba(223,163,63,.5)}
.phone{position:absolute;width:280px;height:606px;border-radius:44px;background:#1b111c;padding:10px;box-shadow:0 36px 70px -18px rgba(42,26,43,.55),0 10px 22px rgba(42,26,43,.18)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:35px;display:block}
.phone:after{content:'';position:absolute;top:19px;left:50%;width:66px;height:17px;margin-left:-33px;border-radius:10px;background:#1b111c}
.card{position:absolute;z-index:10;background:#fff;border:1px solid #ece8e4;border-radius:22px;box-shadow:0 22px 44px -16px rgba(42,26,43,.4)}
.toast{display:flex;gap:14px;align-items:center;padding:16px 20px}
.ok{width:46px;height:46px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0}
.t1{display:block;font-size:19px;font-weight:600}.t2{display:block;font-size:15px;color:var(--muted);margin-top:2px}
.cd{display:flex;gap:8px;padding:13px 15px}
.cd div{background:var(--plum);color:#fff;border-radius:11px;width:56px;padding:8px 0;text-align:center}
.cd b{display:block;font-size:23px;font-weight:600;line-height:1}
.cd span{font-size:10px;letter-spacing:.08em;opacity:.65}

.foot{position:absolute;left:60px;right:60px;bottom:80px;text-align:center}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.chip{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.88);border:1px solid rgba(42,26,43,.1);border-radius:999px;padding:12px 22px;font-size:22px;font-weight:500;box-shadow:0 4px 12px -6px rgba(42,26,43,.2)}
.dot{width:11px;height:11px;border-radius:50%}
.price{margin-top:34px;display:inline-block;background:var(--plum);color:#fff;border-radius:999px;padding:18px 40px;font-size:30px;font-weight:600;letter-spacing:-.01em;box-shadow:0 18px 36px -16px rgba(42,26,43,.7)}
.price span{color:var(--gold-l)}
.petal,.spark{position:absolute}
</style>
</head>
<body>
<div class="blob" style="left:-180px;top:-160px;width:560px;height:520px;background:rgba(223,163,63,.32)"></div>
<div class="blob" style="right:-200px;top:520px;width:520px;height:520px;background:rgba(184,76,116,.2)"></div>
<div class="blob" style="left:-160px;bottom:-200px;width:520px;height:460px;background:rgba(75,147,164,.16)"></div>
<div class="grid"></div>

<svg class="petal" style="left:120px;top:330px;width:26px;color:rgba(184,76,116,.45);transform:rotate(30deg)" viewBox="0 0 24 32"><path d="M12 0C20 8 21 20 12 32C3 20 4 8 12 0Z" fill="currentColor"/></svg>
<svg class="petal" style="right:110px;top:250px;width:20px;color:rgba(223,163,63,.6);transform:rotate(-40deg)" viewBox="0 0 24 32"><path d="M12 0C20 8 21 20 12 32C3 20 4 8 12 0Z" fill="currentColor"/></svg>
<svg class="petal" style="left:70px;top:1130px;width:18px;color:rgba(75,147,164,.45);transform:rotate(70deg)" viewBox="0 0 24 32"><path d="M12 0C20 8 21 20 12 32C3 20 4 8 12 0Z" fill="currentColor"/></svg>
<svg class="petal" style="right:80px;top:1180px;width:20px;color:rgba(217,122,78,.5);transform:rotate(15deg)" viewBox="0 0 24 32"><path d="M12 0C20 8 21 20 12 32C3 20 4 8 12 0Z" fill="currentColor"/></svg>

<div class="head">
  <div class="logo"><img src="../../resources/js/app/assets/images/logo-negativo.png" alt="Convite"></div>
  <p class="eyebrow">Invitaciones digitales</p>
  <h1>para tu <span class="hl">boda</span></h1>
</div>

<div class="stage">
  <div class="glow"></div>
  <div class="ring"></div>

  <div class="phone" style="left:40px;top:90px;transform:rotate(-13deg) scale(.82)"><img src="scr-boda-floral.png" alt=""></div>
  <div class="phone" style="left:680px;top:90px;transform:rotate(13deg) scale(.82)"><img src="scr-boda-moderna.png" alt=""></div>
  <div class="phone" style="left:205px;top:50px;transform:rotate(-6deg) scale(.92);z-index:2"><img src="scr-boda-serena.png" alt=""></div>
  <div class="phone" style="left:515px;top:50px;transform:rotate(6deg) scale(.92);z-index:2"><img src="scr-boda-clasica.png" alt=""></div>

  <div class="card toast" style="left:70px;top:560px">
    <span class="ok">✓</span>
    <span><span class="t1">Familia López confirmó</span><span class="t2">4 personas · ¡Ahí estaremos! 🎉</span></span>
  </div>
  <div class="card cd" style="right:60px;top:20px">
    <div><b>60</b><span>DÍAS</span></div><div><b>07</b><span>HRS</span></div><div><b>24</b><span>MIN</span></div>
  </div>

  <svg class="spark" style="left:160px;top:40px;width:30px;color:var(--gold)" viewBox="0 0 24 24"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z" fill="currentColor"/></svg>
  <svg class="spark" style="right:150px;top:600px;width:24px;color:var(--rose)" viewBox="0 0 24 24"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z" fill="currentColor"/></svg>
</div>

<div class="foot">
  <div class="chips">
    <span class="chip"><span class="dot" style="background:var(--rose)"></span>Con tu música</span>
    <span class="chip"><span class="dot" style="background:var(--gold)"></span>Mapa y cuenta regresiva</span>
    <span class="chip"><span class="dot" style="background:var(--teal)"></span>Confirmación de asistencia</span>
  </div>
  <div class="price">Lista para WhatsApp · <span>desde $499 MXN</span></div>
</div>
</body>
</html>
