<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Convite · Lo que hay dentro de una invitación</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Video 8 de "Publicaciones para ganar alcance": lo que hay dentro de una invitación (18 s), demo boda-floral */
  :root { --blush: #f7e3e6; --rosa: #b8566f; --verde: #3f5a4a; }
  .sc.blush { background: radial-gradient(120% 75% at 50% 18%, #fff 0%, #fbeef0 45%, #f1d7dc 100%); color: var(--ink); }
  #sc1 { visibility: visible; }

  .lbl { top: 120px; height: 360px; }
  .lb { position: absolute; left: 0; right: 0; }
  .lb small { display: block; font-size: 44px; letter-spacing: 10px; color: var(--rosa); margin-bottom: 14px; }
  .lb b { display: block; font-size: 98px; line-height: 1.02; letter-spacing: -3px; }
  .lb b .emo { font-size: 90px; }
  .lb span.sub { display: block; margin-top: 18px; font-size: 52px; font-weight: 500; color: #6a566b; }
  #hook b { font-size: 96px; }

  .phone.zm { width: 640px; height: 1343px; top: 520px; padding: 18px; border-radius: 88px; background: #1d1418;
    box-shadow: 0 0 0 3px #4b3a40, 0 50px 110px #5a2a3a55; }
  .phone.zm .screen { border-radius: 72px; background: #fff; }
  .shot { position: absolute; inset: 0; visibility: hidden; overflow: hidden; }
  .shot .cam { position: absolute; inset: 0; transform-origin: 0 0; }
  .phone .screen .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .phone .screen .shot img + img { visibility: hidden; }
  #rip { z-index: 10; border-color: var(--rosa); background: #b8566f44; }
  .fx { inset: 0; pointer-events: none; }
  .fx span { position: absolute; font-family: 'Noto Color Emoji'; font-size: 84px; opacity: 0; }
  .dots { top: 1885px; display: flex; justify-content: center; gap: 18px; }
  .dots i { width: 18px; height: 18px; border-radius: 50%; background: #d9b7bf; }
  .dots i.on { background: var(--rosa); }

  /* Cierre */
  #e0 { top: 330px; font-size: 92px; line-height: 1.05; letter-spacing: -2px; }
  #e0 .script { font-size: 124px; color: var(--rosa); letter-spacing: 0; }
  #e1 { top: 760px; width: 240px; }
  #e2 { top: 1020px; }
  #e3 { top: 1190px; color: #6a566b; letter-spacing: 6px; text-transform: uppercase; font-size: 48px; }
  #e4 { top: 1380px; width: max-content; font-size: 70px; letter-spacing: -1px; padding: 34px 76px; border-radius: 999px; background: var(--ink); color: var(--ivory); box-shadow: 0 26px 60px #2a1a2b66; }
</style>
</head>
<body>
<div id="stage">

  <section class="sc blush" id="sc1">
    <div class="lbl" id="lbl">
      <div class="lb" id="hook"><small>POV · LA ABRES Y…</small><b>¿Qué hay dentro<br>de una invitación? <span class="emo">👀</span></b></div>
    </div>
    <div class="phone zm" id="ph">
      <div class="screen" id="screen"></div>
      <div class="ripple" id="rip"></div>
    </div>
    <div class="fx" id="fx"></div>
    <div class="dots h" id="dots"></div>
  </section>

  <section class="sc ivory" id="sc2">
    <div class="h" id="e0">Y todo cabe en<br><span class="script">un solo enlace</span></div>
    <img class="logo h" id="e1" src="assets/convite-icon.png">
    <div class="word h" id="e2">Convite</div>
    <div class="md h" id="e3">¿Cuál te gustó más? <span class="emo">👇</span></div>
    <div class="h" id="e4">Síguenos <span class="emo">✨</span></div>
  </section>

</div>
<script src="secciones/boda-floral/data.js"></script>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="timeline-dentro-invitacion.js"></script>
</body>
</html>
