<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Convite · Scroll satisfactorio</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Video 3 de "Publicaciones para ganar alcance": una invitación de principio a fin (15 s), demo xv-disco */
  :root { --neon: #ff4fd8; --cyan: #3ee6ff; --violet: #8b5cff; }
  .sc.disco { background: radial-gradient(120% 70% at 50% 20%, #3a1a55 0%, #1c0d2b 55%, #0c0612 100%); color: var(--ivory); }
  #sc1 { visibility: visible; }
  .beams { inset: 0; opacity: .55; }
  .beam { position: absolute; top: -200px; width: 260px; height: 2300px; margin-left: -130px; transform-origin: 50% 0;
    background: linear-gradient(180deg, var(--c) 0%, transparent 75%); filter: blur(28px); mix-blend-mode: screen; opacity: .45; }
  .dots { inset: 0; }
  .dots i { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 18px 4px var(--c); opacity: 0; }

  #hook { top: 95px; }
  .hk { font-size: 92px; line-height: 1.02; letter-spacing: -3px; }
  .hk small { display: block; font-size: 48px; letter-spacing: 10px; color: var(--neon); margin-bottom: 18px; text-shadow: 0 0 24px #ff4fd8aa; }
  .hk .emo { font-size: 84px; }

  .phone.rec { width: 680px; height: 1430px; top: 440px; padding: 18px; border-radius: 92px; background: #0b0710;
    box-shadow: 0 0 0 3px #3b2a4d, 0 0 70px 6px #ff4fd855, 0 0 160px 30px #8b5cff33, 0 60px 120px #000c; }
  .phone.rec .screen { border-radius: 76px; background: #120a1a; }
  .phone.rec .screen img { object-fit: cover; object-position: top; }
  #rip { z-index: 10; border-color: var(--cyan); background: #3ee6ff44; }

  .speed { top: 338px; left: 800px !important; right: auto !important; margin: 0 !important; width: max-content; padding: 14px 30px; border-radius: 999px;
    font-size: 54px; background: var(--neon); color: #fff; box-shadow: 0 0 40px #ff4fd8aa; }
  .track { top: 700px; left: 985px !important; right: auto !important; margin: 0 !important; width: 10px; height: 1050px; border-radius: 99px; background: #ffffff22; }
  .track b { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 99px; background: linear-gradient(var(--cyan), var(--neon)); transform-origin: 50% 0; transform: scaleY(0); }
  .track .ball { position: absolute; left: -38px; top: -40px; font-family: 'Noto Color Emoji'; font-size: 76px; }
  .notes span { position: absolute; font-family: 'Noto Color Emoji'; font-size: 74px; opacity: 0; }

  /* Cierre */
  .sc.ivory2 { background: radial-gradient(120% 80% at 50% 30%, #fff 0%, var(--ivory) 50%, #f6ead6 100%); }
  #e0 { top: 330px; font-size: 92px; line-height: 1.05; letter-spacing: -2px; color: var(--ink); }
  #e0 .script { font-size: 120px; color: var(--rose); letter-spacing: 0; }
  #e1 { top: 760px; width: 240px; }
  #e2 { top: 1020px; }
  #e3 { top: 1190px; color: #6a566b; letter-spacing: 6px; text-transform: uppercase; font-size: 48px; }
  #e4 { top: 1380px; width: max-content; font-size: 70px; letter-spacing: -1px; padding: 34px 76px; border-radius: 999px; background: var(--ink); color: var(--ivory); box-shadow: 0 26px 60px #2a1a2b66; }
</style>
</head>
<body>
<div id="stage">

  <!-- 1 · La invitación de principio a fin -->
  <section class="sc disco" id="sc1">
    <div class="beams" id="beams"></div>
    <div class="dots" id="dots"></div>
    <div id="hook" class="hk"><small>DE PRINCIPIO A FIN</small>Así se ve una<br>invitación de XV <span class="emo">🪩</span></div>
    <div class="notes" id="notes"></div>
    <div class="phone rec" id="ph">
      <div class="screen"><img id="rec" alt=""></div>
      <div class="ripple" id="rip"></div>
    </div>
    <div class="speed h" id="speed">⏩ 2x</div>
    <div class="track h" id="track"><b id="fill"></b><span class="ball" id="ball">🪩</span></div>
  </section>

  <!-- 2 · Cierre -->
  <section class="sc ivory2" id="sc2">
    <div class="h" id="e0">¿Cuál vemos completa<br><span class="script">la próxima?</span></div>
    <img class="logo h" id="e1" src="assets/convite-icon.png">
    <div class="word h" id="e2">Convite</div>
    <div class="md h" id="e3">Coméntalo y síguenos</div>
    <div class="h" id="e4">Guárdala <span class="emo">📌</span></div>
  </section>

</div>
<script src="scroll/xv-disco/frames.js"></script>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="timeline-scroll-xv.js"></script>
</body>
</html>
